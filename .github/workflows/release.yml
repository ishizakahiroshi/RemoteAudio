name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Per-channel recovery. A channel can fail on its own (registry setup,
  # external review, or a rate limit) while the canonical GitHub Release is already correct, so each
  # one has to be re-runnable without re-tagging or re-building. Check exactly
  # the channel that needs republishing; both default to off so a dispatch never
  # touches a channel by accident.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to republish from (e.g. v0.1.0)"
        required: true
        type: string
      npm_only:
        description: "Republish the npm packages from the canonical release"
        required: false
        default: false
        type: boolean
      crates_only:
        description: "Republish the crate to crates.io from the tag"
        required: false
        default: false
        type: boolean
      winget_only:
        description: "Re-submit the winget manifest update for the tag"
        required: false
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Release preflight
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Verify version single-source agreement
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          version="${RELEASE_TAG#v}"
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$version"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./npm/platforms/win32-x64/package.json').version")" = "$version"
      - name: Require a green Validate run for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list --workflow Validate --limit 50 --json headSha,conclusion \
            --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .conclusion" | head -n 1)
          test "$conclusion" = success
      - name: Test
        run: cargo test --all-targets --locked

      # The npm launcher is published from this same commit; a broken platform
      # mapping or swallowed exit code must not reach the registry.
      - name: Test npm launcher
        run: npm test

  build:
    name: Build
    needs: preflight
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release --locked
      - name: Stage canonical binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/win32-x64
          cp target/release/RemoteAudio.exe staging/win32-x64/RemoteAudio.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-win32-x64
          path: staging
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - name: Create archive
        run: |
          set -euo pipefail
          mkdir release
          (cd artifacts/win32-x64 && zip -q "../../release/audioremote-win32-x64.zip" RemoteAudio.exe)
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release/audioremote-sbom.spdx.json
          artifact-name: audioremote-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        run: |
          set -euo pipefail
          (cd release && sha256sum audioremote-* > SHA256SUMS.txt)
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to mutate immutable assets" >&2
            exit 1
          fi
          gh release create "$tag" release/* --generate-notes --title "$tag" --verify-tag
          gh release view "$tag" --json body -q .body \
            | awk '/^## SHA256 checksums/{exit} {print}' > release-notes.md
          {
            printf '\n## SHA256 checksums\n\n```text\n'
            cat release/SHA256SUMS.txt
            printf '```\n'
          } >> release-notes.md
          gh release edit "$tag" --notes-file release-notes.md

  npm-publish:
    name: Publish npm packages
    needs: [build, github-release]
    if: ${{ always() && (needs.github-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.npm_only)) }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Download and verify canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          mkdir canonical
          gh release download "$RELEASE_TAG" --dir canonical
          (cd canonical && sha256sum --check SHA256SUMS.txt)
          mkdir -p npm/platforms/win32-x64/bin
          unzip -q canonical/audioremote-win32-x64.zip -d npm/platforms/win32-x64/bin
      - name: Validate version and stage platform package
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_version=$(node -p "require('./package.json').version")
          test "$version" = "$package_version"
          cp README.md LICENSE npm/platforms/win32-x64/
      - name: Verify npm CLI supports Trusted Publishing
        run: |
          set -euo pipefail
          node -e 'const [major, minor, patch] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)'
          npm_version=$(npm --version)
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) process.exit(1)' "$npm_version"
          echo "Trusted Publishing toolchain: Node $(node --version), npm $npm_version"
      - name: Publish platform package, then root
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          publish_once() {
            dir="$1"
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "already published: $name@$version"
            else
              for attempt in 1 2 3 4 5; do
                if npm publish "$dir" --access public --provenance --tag "$dist_tag" 2>publish.log; then
                  return 0
                fi
                if ! grep -Eqi '429|rate.?limit' publish.log || [[ "$attempt" == 5 ]]; then
                  cat publish.log >&2
                  return 1
                fi
                delay=$((attempt * attempt * 15))
                echo "npm rate limit for $name; retrying in ${delay}s"
                sleep "$delay"
              done
            fi
          }
          publish_once "npm/platforms/win32-x64"
          publish_once "."

  crates-publish:
    name: Publish to crates.io
    needs: github-release
    # `always()` so the manual path still runs when github-release is skipped
    # (it only runs for tag pushes). On a tag push this stays gated on the
    # canonical release having succeeded first — crates.io is append-only, so a
    # version must never go out ahead of the release it belongs to.
    if: ${{ always() && (needs.github-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.crates_only)) }}
    runs-on: windows-latest
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Check already published
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # crates.io answers 403 to requests without a descriptive User-Agent.
          # Without -A this check always fell through to "not published", so a
          # re-run would attempt the upload and fail on a duplicate version
          # instead of skipping cleanly.
          status=$(curl -sS \
            -A "audioremote-release-workflow (+https://github.com/ishizakahiroshi/RemoteAudio)" \
            -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/audioremote/$version")
          echo "crates.io version probe: HTTP $status"
          if [[ "$status" == "200" ]]; then
            echo "already published: audioremote@$version"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io Trusted Publishing
        id: auth
        if: ${{ steps.check.outputs.skip == 'false' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish
        if: ${{ steps.check.outputs.skip == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  winget-submit:
    name: Submit winget manifest
    needs: github-release
    if: ${{ always() && (needs.github-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.winget_only)) }}
    # Never allowed to fail the release. This opens a pull request in a
    # repository we do not own, which then waits on Microsoft's review and their
    # automated checks. A release is done when the artifacts are published; what
    # happens afterwards in someone else's queue cannot retroactively make it
    # unsuccessful. Failures still show in the log with a reason.
    continue-on-error: true
    runs-on: windows-latest
    environment: winget-publish
    permissions:
      contents: read
    steps:
      - name: Check winget submit credential
        id: winget-token
        shell: bash
        env:
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          if [[ -n "$WINGET_PKGS_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WINGET_PKGS_TOKEN is not configured; winget channel skipped"
          fi

      # Prereleases stay off winget. `winget install` with no version argument
      # takes the newest manifest, so publishing an -rc would hand it to
      # everyone who typed the plain command.
      - name: Skip prereleases
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$version" == *-* ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "$version is a prerelease; winget channel skipped"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Submit manifest update
        if: ${{ steps.winget-token.outputs.available == 'true' && steps.channel.outputs.eligible == 'true' }}
        shell: pwsh
        env:
          VERSION: ${{ steps.channel.outputs.version }}
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Fixed release asset and digest; do not execute a moving latest URL.
          $wingetCreateVersion = '1.12.13.0'
          $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/v$wingetCreateVersion/wingetcreate.exe"
          $expectedSha256 = '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea'
          Invoke-WebRequest $wingetCreateUrl -OutFile wingetcreate.exe
          $actualSha256 = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "wingetcreate.exe checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/audioremote-win32-x64.zip"
          # `update` and not `new`: it edits the manifests already in
          # winget-pkgs, which is why the first version has to be submitted by
          # hand once (see packaging/winget/SUBMITTING.md).
          .\wingetcreate.exe update ishizakahiroshi.AudioRemote `
            --version $env:VERSION `
            --urls $url `
            --submit `
            --token $env:WINGET_PKGS_TOKEN
