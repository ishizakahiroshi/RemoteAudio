[package]
name = "audioremote"
version = "0.1.0"
edition = "2021"
# Effective floor of the locked dependency graph, not an aspiration: rust-embed
# 8.12 needs 1.80, cargo_metadata 0.19 needs 1.78, and the toml 1.1 / sha2 0.11
# chain pulled in below needs 1.85. Verified by the fixed-toolchain job in
# .github/workflows/validate.yml — raise both together or not at all.
rust-version = "1.85"
description = "Switch your Windows 11 host's default audio output device from any browser on the LAN"
readme = "README.md"
license = "MIT"
repository = "https://github.com/ishizakahiroshi/RemoteAudio"
homepage = "https://github.com/ishizakahiroshi/RemoteAudio"
keywords = ["windows", "audio", "core-audio", "remote", "endpoint"]
categories = ["command-line-utilities", "multimedia::audio", "os::windows-apis"]
authors = ["Hiroshi Ishizaka (ishizakahiroshi) <ishizakahiroshi.dev@gmail.com>"]
# `packaging/audioremote.manifest` and not `packaging/**`: the manifest is
# required to build a working exe, while the MSIX assets that will join it in
# that folder are release-time inputs with no business in a crates.io tarball.
include = [
    "src/**",
    "web/**",
    "build.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "packaging/audioremote.manifest",
]

[[bin]]
name = "RemoteAudio"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    # `time` powers the audio-gate acquisition timeout in server.rs.
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
getrandom = "0.2"
rust-embed = "8"
local-ip-address = "0.6"
ipnet = "2"

[build-dependencies]
cargo_metadata = "0.19"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Registry",
    # supervisor.rs: Ctrl+C hook, and the job object that stops a forced kill of
    # the supervisor from leaving an orphaned server holding the port.
    # main.rs: AttachConsole, so the CLI subcommands still print once the release
    # build stops carrying a console of its own.
    "Win32_System_Console",
    # main.rs: reopening CONIN$/CONOUT$ after that attach.
    "Win32_Storage_FileSystem",
    # autostart.rs: `GetCurrentPackageFullName` answers "am I the MSIX build?",
    # which decides whether logon startup is ours to install or the package
    # manifest's to declare.
    "Win32_Storage_Packaging_Appx",
    "Win32_System_JobObjects",
    # Pulled in by JobObjects: `CreateJobObjectW` takes SECURITY_ATTRIBUTES and
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION lives behind the Threading feature.
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
    # tray.rs: SHGetKnownFolderPath locates the user's actual Desktop, including
    # OneDrive/known-folder redirection, for the explicit share shortcut action.
    "Win32_UI_Shell",
    # autostart.rs: `ShellExecuteExW` with the `runas` verb needs SW_HIDE.
    # tray.rs: the window class, popup menu and icon decoding all live here.
    "Win32_UI_WindowsAndMessaging",
    # Not for drawing: `WNDCLASSW`/`RegisterClassW` carry an `HBRUSH` background,
    # so windows-rs gates the whole window-class API behind Gdi. Bindings only —
    # the tray never paints anything.
    "Win32_Graphics_Gdi",
    # welcome.rs: TaskDialogIndirect. Needs the comctl32 v6 dependency declared
    # in packaging/audioremote.manifest — see the note there.
    "Win32_UI_Controls",
    # tray.rs: Shell_NotifyIcon lives under Win32_UI_Shell (already pulled in by
    # the PropertiesSystem feature above); these are the rest of its surface.
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # lang.rs: GetUserDefaultUILanguage picks the tray's language.
    "Win32_Globalization",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
