<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Remote Audio</title>

  <!-- Cream background frame (matches Web UI bg #f7f3ea) -->
  <rect width="512" height="512" rx="104" fill="#f7f3ea"/>

  <!-- Chunky speaker body (ink #241f1a) -->
  <rect x="72" y="120" width="240" height="272" rx="40" fill="#241f1a"/>

  <!-- Speaker cone: hollowed cream circle with orange center (the eye) -->
  <circle cx="192" cy="272" r="86" fill="#f7f3ea"/>
  <circle cx="192" cy="272" r="40" fill="#ff7a3d"/>

  <!-- Small status LED near the top of the speaker (accent dot) -->
  <circle cx="256" cy="164" r="14" fill="#ff7a3d"/>

  <!-- Three orange wave arcs radiating to the right = remote signal -->
  <g fill="none" stroke="#ff7a3d" stroke-width="30" stroke-linecap="round">
    <!-- inner wave  (radius approx 150) -->
    <path d="M 336 194 A 150 150 0 0 1 336 350"/>
    <!-- middle wave (radius approx 200) -->
    <path d="M 361 156 A 200 200 0 0 1 361 388"/>
    <!-- outer wave  (radius approx 250) -->
    <path d="M 386 119 A 250 250 0 0 1 386 425"/>
  </g>
</svg>
